<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Vector Estimation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #444;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding-left: 10px;
            padding-top: 10px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .output {
            margin-top: 20px;
            background: #f1f1f1;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Normal Vector Estimation</h1>
        <p>Enter your points in JSON format (example: <code>[[1,2,3],[4,5,6]]</code>)</p>

        <textarea id="pointsInput">[[1,2,3],[4,5,6]]</textarea>
        <br>
        <button onclick="runCpp()">Run Estimation</button>

        <div id="output" class="output"></div>
    </div>

    <script>
        async function runCpp() {
            const pointsText = document.getElementById('pointsInput').value;

            document.getElementById('output').innerText = "Running, please wait...";

            try {
                const response = await fetch('https://normal-vector-estimation.onrender.com/run_cpp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ points: pointsText }) // send raw string
                });

                const result = await response.json();
                console.log(result);

                if (result.error) {
                    document.getElementById('output').innerText = "Error: " + result.error;
                } else {
                    document.getElementById('output').innerText = result.stdout || result.result || "(No output)";
                }
            } catch (error) {
                document.getElementById('output').innerText = "Request failed: " + error;
            }
        }
    </script>

</body>

</html>
